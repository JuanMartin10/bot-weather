name: Daily forecast

on:
  workflow_dispatch:
    inputs:
      once_daily:
        description: Skip if today's forecast was already sent
        type: boolean
        default: false
  schedule:
    # Times are UTC. 08:30 in Madrid is 06:30 UTC in summer and 07:30 UTC in winter; the later
    # slots are retries, because scheduled runs can be delayed or dropped. `--once-daily` makes
    # every run after the first valid one a no-op.
    - cron: "30 6-10 * * *"

permissions:
  contents: read

# Both workflows share the cached state, so their runs must not overlap.
concurrency:
  group: bot-state

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Each run saves under a new key and restores the latest one: cache entries are immutable.
      - uses: actions/cache@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      # A plain manual run always sends. Scheduled runs, and dispatches that ask for it, are
      # deduplicated so an external scheduler and GitHub's own can both trigger this workflow.
      - run: node src/main.ts ${{ (github.event_name == 'schedule' || inputs.once_daily) && '--once-daily' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEATHER_LATITUDE: ${{ secrets.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ secrets.WEATHER_LONGITUDE }}
