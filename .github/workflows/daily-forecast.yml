name: Daily forecast

on:
  workflow_dispatch:
  schedule:
    # Times are UTC. 08:30 in Madrid is 06:30 UTC in summer and 07:30 UTC in winter; the later
    # slots are retries, because scheduled runs can be delayed or dropped. `--once-daily` makes
    # every run after the first valid one a no-op.
    - cron: "30 6-10 * * *"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Each run saves under a new key and restores the latest one: cache entries are immutable.
      - uses: actions/cache@v6
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      # A manual run always sends; only scheduled runs are deduplicated.
      - run: node src/main.ts ${{ github.event_name == 'schedule' && '--once-daily' || '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEATHER_LATITUDE: ${{ secrets.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ secrets.WEATHER_LONGITUDE }}
